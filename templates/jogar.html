<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo das Letras (8 Letras)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    text-align: center;
    padding: 40px;
  }

  h1 {
    color: #333;
  }

  #palavra {
    font-size: 2em;
    letter-spacing: 10px;
    margin: 20px;
  }

  .input-area {
    margin: 20px 0;
  }

  select, input[type="text"], button {
    padding: 8px 12px;
    font-size: 1em;
    margin: 5px;
  }

  #mensagem {
    font-size: 1.2em;
    margin-top: 20px;
    color: #555;
  }

  #container {
    background-color: white;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    display: inline-block;
  }
</style>
</head>
<body>
  <h1>🎯 Jogo das Letras (8 Letras)</h1>

  <div id="container">
    <div id="palavra">_ _ _ _ _ _ _ _</div>

    <div class="input-area">
      <label for="letra">Escolha uma letra:</label>
      <select id="letra"><option value="">--</option></select>

      <label for="posicao">Posição:</label>
      <select id="posicao"><option value="">--</option></select>

      <button id="tentar">Tentar</button>
    </div>

    <div class="input-area">
      <input type="text" id="chute" placeholder="Chute a palavra inteira">
      <button id="chutar">Chutar Palavra</button>
    </div>

    <div id="mensagem"></div>
  </div>

<script>
  // === Lista de palavras de 8 letras ===
  const palavras = [
    "ELEFANTE",
    "COMPUTAR",
    "PESSOAL",
    "ANIMALES",
    "HOSPITAL",
    "TREINADO",
    "AVENTURA",
    "CAMINHAR"
  ];

  // Sorteia uma palavra
  const palavraSecreta = palavras[Math.floor(Math.random() * palavras.length)];
  let progresso = Array(8).fill("_");

  const letraSelect = document.getElementById("letra");
  const posicaoSelect = document.getElementById("posicao");
  const mensagem = document.getElementById("mensagem");
  const palavraDisplay = document.getElementById("palavra");

  // Popula letras A-Z
  for (let i = 65; i <= 90; i++) {
    const opt = document.createElement("option");
    opt.value = String.fromCharCode(i);
    opt.textContent = String.fromCharCode(i);
    letraSelect.appendChild(opt);
  }

  // Popula posições de 1 a 8
  for (let i = 1; i <= 8; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i;
    posicaoSelect.appendChild(opt);
  }

  function atualizarDisplay() {
    palavraDisplay.textContent = progresso.join(" ");
  }

  document.getElementById("tentar").addEventListener("click", () => {
    const letra = letraSelect.value;
    const pos = parseInt(posicaoSelect.value) - 1;

    if (!letra || isNaN(pos)) {
      mensagem.textContent = "Escolha uma letra e uma posição!";
      return;
    }

    if (progresso[pos] !== "_") {
      mensagem.textContent = "Essa posição já foi preenchida!";
      return;
    }

    if (palavraSecreta[pos] === letra) {
      progresso[pos] = letra;
      mensagem.textContent = "✅ Acertou a letra!";
    } else {
      mensagem.textContent = "❌ Errou, tente outra!";
    }

    atualizarDisplay();

    if (!progresso.includes("_")) {
      mensagem.textContent = "🎉 Parabéns! Você descobriu a palavra: " + palavraSecreta;
    }
  });

  document.getElementById("chutar").addEventListener("click", () => {
    const chute = document.getElementById("chute").value.toUpperCase();
    if (chute === palavraSecreta) {
      progresso = palavraSecreta.split("");
      atualizarDisplay();
      mensagem.textContent = "🎉 Acertou a palavra inteira!";
    } else {
      mensagem.textContent = "😞 Palavra errada! Tente novamente.";
    }
  });

  atualizarDisplay();
</script>
</body>
</html>
